
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-a05-governance"
version = "0.1.0"
description = "Standalone AI Governance and Policy Enforcement"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0,<7",
    "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring integration with another project",
]
